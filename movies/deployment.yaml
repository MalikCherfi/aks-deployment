apiVersion: apps/v1
kind: Deployment
metadata:
  name: movies-app
  labels:
    app.kubernetes.io/name: movies-app
    app.kubernetes.io/instance: movies-app
    app.kubernetes.io/version: "1.14.2"
    app.kubernetes.io/component: backend
    app.kubernetes.io/part-of: demo-app
    app.kubernetes.io/managed-by: kustomize
spec:
  replicas: 3
  selector:
    matchLabels:
      app.kubernetes.io/name: movies-app
      app.kubernetes.io/instance: movies-app
  template:
    metadata:
      labels:
        app.kubernetes.io/name: movies-app
        app.kubernetes.io/instance: movies-app
        app.kubernetes.io/version: "1.14.2"
        app.kubernetes.io/component: backend
        app.kubernetes.io/part-of: demo-app
        app.kubernetes.io/managed-by: kustomize
    spec:
      topologySpreadConstraints:
        - maxSkew: 1
          topologyKey: kubernetes.io/hostname
          whenUnsatisfiable: ScheduleAnyway
          labelSelector:
            matchLabels:
              app.kubernetes.io/name: movies-app
              app.kubernetes.io/instance: movies-app
      containers:
        - name: movies-app
          image: kubernetes/media-api:1.0.0
          imagePullPolicy: IfNotPresent
          command: ["/app/movies"]
          env:
            - name: PORT
              value: "8081"
          ports:
            - name: http
              containerPort: 8081
          resources:
            requests:
              cpu: "100m"
              memory: "64Mi"
            limits:
              cpu: "200m"
              memory: "128Mi"

name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

env:
  CONTAINER_NAME: "api"
  RESOURCE_GROUP: ${{ secrets.RESOURCE_GROUP }}

jobs:
  lint:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: "1.23"
          cache: true

      - name: "Vérifier le formatage"
        run: |
          if [ -n "$(gofmt -l .)" ]; then
            echo "Les fichiers suivants ne sont pas formatés correctement :"
            gofmt -l .
            exit 1
          fi

      - name: "Vérification statique (go vet)"
        run: go vet ./...

  test:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: "1.23"
          cache: true

      - name: "Télécharger les dépendances"
        run: go mod download

      - name: "Tests unitaires avec détection de data race et couverture"
        run: go test -v -race -coverprofile=coverage.out ./...

  test-matrix:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        go-version: ["1.25.12", "1.26.4"]
      fail-fast: false

    steps:
      - uses: actions/checkout@v4

      - name: Setup Go ${{ matrix.go-version }}
        uses: actions/setup-go@v5
        with:
          go-version: ${{ matrix.go-version }}
          cache: true

      - name: Tests Go ${{ matrix.go-version }}
        run: go test ./...

  buildImage:
    if: github.event_name == 'push' && github.ref_name == 'main'
    needs: [lint, test, test-matrix]
    permissions:
      contents: read
      id-token: write
    runs-on: ubuntu-latest
    outputs:
      acr_name: ${{ steps.get-acr.outputs.acr_name }}
    steps:
      # Checks out the repository this file is in
      - uses: actions/checkout@v7

      # Logs in with your Azure credentials
      - name: Azure login
        uses: azure/login@v3
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      - name: Retrieve ACR name from ACR tags
        id: get-acr
        run: |
          ACR_NAME=$(az acr list --resource-group ${{ env.RESOURCE_GROUP }} \
          --query "[?tags.owner=='malik-cherfi'].name" -o tsv)
          echo "acr_name=$ACR_NAME" >> "$GITHUB_OUTPUT"

      - name: Build and push image to ACR
        run: |
          az acr build \
          --image ${{ steps.get-acr.outputs.acr_name }}.azurecr.io/${{ env.CONTAINER_NAME }}:${{ github.sha }} \
          --registry ${{ steps.get-acr.outputs.acr_name }} \
          -g ${{ env.RESOURCE_GROUP }} .

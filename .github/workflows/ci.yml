name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  lint:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: "1.23"
          cache: true

      - name: "Vérifier le formatage"
        run: |
          if [ -n "$(gofmt -l .)" ]; then
            echo "Les fichiers suivants ne sont pas formatés correctement :"
            gofmt -l .
            exit 1
          fi

      - name: "Vérification statique (go vet)"
        run: go vet ./...

  test:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: "1.23"
          cache: true

      - name: "Télécharger les dépendances"
        run: go mod download

      - name: "Tests unitaires avec détection de data race et couverture"
        run: go test -v -race -coverprofile=coverage.out ./...

  test-matrix:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        go-version: ["1.25.12", "1.26.4"]
      fail-fast: false

    steps:
      - uses: actions/checkout@v4

      - name: Setup Go ${{ matrix.go-version }}
        uses: actions/setup-go@v5
        with:
          go-version: ${{ matrix.go-version }}
          cache: true

      - name: Tests Go ${{ matrix.go-version }}
        run: go test ./...
